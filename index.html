  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --text-color: #f3f4f6;
      --accent-color: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      color: var(--text-color);
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    header p {
      color: #9ca3af;
      margin-top: 0.5rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
      perspective: 1000px; /* Essential for 3D layout context */
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      width: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .media-container {
      width: 100%;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Keep images at natural proportions instead of clipping or crushing squares */
    .media-container img, 
    .media-container video {
      width: 100%;
      height: auto;
      max-height: 550px;
      object-fit: contain;
      display: block;
      transform: translateZ(20px); /* 3D pop depth layers */
    }

    .profile-info {
      padding: 1.25rem;
      text-align: center;
      background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
      transform: translateZ(30px);
    }

    .profile-info h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>

    // Converts default GitHub web links into raw renderable asset URLs
    function formatGitHubUrl(url) {
      if (url.includes('github.com') && url.includes('/blob/')) {
        return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
      }
      return url;
    }

    const gallery = document.getElementById('gallery');

    // Dynamically expand users with multiple assets into dedicated card items
    rawData.forEach(user => {
      user.urls.forEach(url => {
        const rawUrl = formatGitHubUrl(url);
        const isVideo = rawUrl.toLowerCase().endsWith('.mp4');

        const card = document.createElement('div');
        card.className = 'card';

        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'media-container';

        if (isVideo) {
          const video = document.createElement('video');
          video.src = rawUrl;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          mediaContainer.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = rawUrl;
          img.alt = user.name;
          img.loading = "lazy";
          mediaContainer.appendChild(img);
        }

        const info = document.createElement('div');
        info.className = 'profile-info';
        info.innerHTML = `<h3>${user.name}</h3>`;

        card.appendChild(mediaContainer);
        card.appendChild(info);
        gallery.appendChild(card);

        // Core 3D Tilt Vector Math Hook
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const xc = rect.width / 2;
          const yc = rect.height / 2;
          
          // Calculate max 20deg tilt variance shifts dynamically
          const angleX = (yc - y) / yc * 20;
          const angleY = (x - xc) / xc * 20;
          
          card.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg) scale(1.03)`;
        });

        // Clear vector states smoothly when leaving the element boundary
        card.addEventListener('mouseleave', () => {
          card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });
      });
    });
